[project]
name = "tutor-rag-backend"
version = "0.1.0"
description = "Multimodal Educational Tutor RAG — FastAPI backend and ingestion workers"
readme = "../README.md"
requires-python = "==3.12.*"

# Runtime dependencies live in [dependency-groups] below rather than here, so a
# failure installing the heavy ML stack cannot block work on the rest of the backend.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Dependency groups
# ---------------------------------------------------------------------------
# core     — API, data layer, configuration, observability
# parsing  — PDF and image handling (§14)
# storage  — object storage adapter (ADR-0013)
# ml       — added in step 0.3, once the CUDA version is known
# dev      — tooling and tests
#
# Install:  uv sync                      (default groups: core, parsing, storage, dev)
#           uv sync --group ml           (once step 0.3 has declared it)
[dependency-groups]

core = [
    # Web framework and serving
    "fastapi>=0.118",
    "uvicorn[standard]>=0.38",
    "sse-starlette>=3.0",            # FR-GEN-12, FR-API-04 — streaming answers

    # Validation and configuration
    "pydantic>=2.12",
    "pydantic-settings>=2.11",       # step 0.6 — typed settings, D-20

    # Data layer — async throughout (D-25)
    "sqlalchemy[asyncio]>=2.0.44",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.17",                 # owns schema and RLS (D-11)
    "pgvector>=0.4",                 # SQLAlchemy type for embedding columns

    # HTTP and auth
    "httpx>=0.28",
    "pyjwt[crypto]>=2.11",           # FR-AUTH-02 — Supabase token verification

    # Observability
    "structlog>=25.5",               # NFR-OBS-01, NFR-OBS-02, NFR-PRV-03

    # Utility
    "tenacity>=9.1",                 # FR-MDL-18, NFR-REL-03 — bounded retry
]

parsing = [
    "pypdf>=6.1",                    # FR-ING-02 — metadata, native text
    "pdfplumber>=0.11",              # FR-ING-02 — layout, blocks, tables
    "pypdfium2>=5.0",                # FR-ING-02 — page and region rendering
    "pillow>=12.0",                  # FR-ING-02 — image operations
    # OpenCV is intentionally absent — FR-ING-03 admits it only where
    # preprocessing is genuinely necessary. Add it when a page demands it.
]

storage = [
    "aioboto3>=15.5",                # ADR-0013 — R2 via S3-compatible presigned URLs
]

ml = [
    # GPU — embeddings and reranking (D-27)
    "torch>=2.6",                    # cu126: driver 555.97 supports CUDA 12.x via minor-version compat
    "sentence-transformers>=5.0",    # FR-IDX-01 bge-small-en-v1.5, FR-RET-08 ms-marco-MiniLM-L6-v2

    # CPU — OCR (D-27). Deliberately the CPU wheel, not paddlepaddle-gpu.
    "paddlepaddle>=3.0",
    "paddleocr>=3.0",                # FR-ING-09 PP-OCRv6, FR-ING-11 VL fallback
]

dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "mypy>=1.19",
    "anyio>=4.11",
    "httpx2>=2.9.1",                 # required by starlette.testclient since Starlette 1.3
]

[tool.uv]
# `ml` is excluded from the default set: it is large, and installing it is a separate
# deliberate act (`uv sync --group ml`). See PLAN.md step 0.3.
default-groups = ["core", "parsing", "storage", "dev"]

# torch resolves from the CUDA 12.6 index rather than PyPI. Driver 555.97 reports CUDA
# 12.5; CUDA minor-version compatibility covers any 12.x runtime on a driver >= 525, so
# cu126 is safe here while cu128/cu129 would want a newer driver.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

# ---------------------------------------------------------------------------
# Ruff — lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "ASYNC",     # async correctness — load-bearing given D-25
    "S",         # bandit — security posture is a first-class concern here
    "DTZ",       # timezone-aware datetimes — FR-MEM-13, FR-JOB-02 depend on this
    "PTH",       # pathlib over os.path
    "T20",       # no print — structlog only (D-26)
    "TID",       # tidy imports
    "ARG",       # unused arguments
    "TRY",       # exception handling
    "PL",        # pylint subset
]
ignore = [
    "TRY003",    # long messages in exceptions — we want them descriptive
    "PLR0913",   # many arguments — dependency injection legitimately has them
    "PLR2004",   # magic values — too noisy before constants exist
    "S101",      # assert — re-enabled outside tests via per-file-ignores below
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG001", "PLR2004"]      # asserts and fixture args are the point
"alembic/**" = ["E501", "N999", "ARG001"]        # generated migration scaffolding

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — strict where the rules live, pragmatic at the edges
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
no_implicit_reexport = true

# Baseline for infrastructure and presentation: typed, but not strict. Adapters wrap
# third-party libraries whose own typing is inconsistent, and fighting that adds noise
# without adding safety.
disallow_untyped_defs = true
check_untyped_defs = true

# The domain and application layers hold the business rules and the security invariants.
# They depend on nothing external (ARCHITECTURE.md §4), so there is no excuse for looseness.
[[tool.mypy.overrides]]
module = ["app.domain.*", "app.application.*"]
strict = true

# Third-party packages without type information.
[[tool.mypy.overrides]]
module = [
    "aioboto3.*",
    "paddle.*",
    "paddleocr.*",
    "pdfplumber.*",
    "pypdfium2.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers --strict-config -ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "security: enforces a requirement from the security test suite (§64)",
    "gate: enforces a zero-tolerance release gate (NFR-GATE-01..06)",
    "slow: takes more than a second",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py"]

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
